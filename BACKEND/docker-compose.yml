version: '3.8'

services:
  api:
    build: .
    container_name: result_management_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=./exam_result_analysis.db
      - JWT_SECRET=production-secret-key-change-me
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    volumes:
      - ./exam_result_analysis.db:/app/exam_result_analysis.db
