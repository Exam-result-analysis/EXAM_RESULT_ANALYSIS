version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: BACKEND/Dockerfile
    container_name: exam_result_analysis_app
    restart: unless-stopped
    ports:
      - "9090:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/exam_result_analysis.db
      - JWT_SECRET=production-secret-key-change-me
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    volumes:
      - ./BACKEND/data:/app/data




